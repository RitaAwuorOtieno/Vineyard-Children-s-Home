<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow"><title>Administrator sign in | Vineyard Children's Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><nav class="nav"><a class="logo" href="index.html"><img src="images/Vineyard%20logo.jpeg" alt="Vineyard Children's Home logo"><span class="logo-text">Vineyard Children's Home<span>Administrator access</span></span></a><a class="btn btn-outline" href="index.html">Return to website</a></nav></header>
  <main class="container content-block admin-editor admin-auth">
    <h1>Administrator sign in</h1><p>Sign in with an account authorized by the site administrator.</p>
    <form id="login-form">
      <label>Email address <input type="email" name="email" autocomplete="username" required></label>
      <label>Password <span class="password-row"><input id="password" type="password" name="password" autocomplete="current-password" required><button id="toggle-password" type="button" class="btn btn-outline" aria-label="Show password" aria-pressed="false">Show</button></span></label>
      <p id="login-status" role="status" aria-live="polite"></p>
      <div class="hero-buttons"><button class="btn btn-blue" type="submit">Sign in</button><button id="reset-password" class="btn btn-outline" type="button">Send password reset email</button></div>
    </form>
    <p><a class="text-link" href="index.html">Back to the public website</a></p>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
